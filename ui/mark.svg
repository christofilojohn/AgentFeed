    <path d="M18 44a26 26 0 0 1 26 26"/>
    <path d="M18 24a46 46 0 0 1 46 46"/>
  </g>
  <rect x="18" y="64" width="14" height="14" rx="3.5" fill="#FF8C1A"/>
</svg>
