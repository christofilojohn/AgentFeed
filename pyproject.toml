[project]
name = "agentfeed"
version = "0.1.0"
description = "AgentFeed — a news reader and protocol, with a local open model behind it."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "trafilatura>=1.12",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "ddgs>=9.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.1",
    "pyinstaller>=6.10",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.3; sys_platform == 'darwin'",
]
mcp = ["mcp>=1.2"]

[project.scripts]
agentfeed-desktop = "agentfeed.desktop:run"
agentfeed = "agentfeed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentfeed"]
