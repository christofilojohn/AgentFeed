name = "markets"
label = "Markets & trading intelligence"
description = """
Company, sector and macro news filed for market relevance: what happened, to
whom, and what it is evidence of. Feeds the signals layer.

This pack organises information. It does not produce investment advice, and
nothing derived from it should be treated as a recommendation.
"""
analyst_role = "a markets research analyst"
audience = "an analyst who needs the facts and their provenance, not a view"
item_types = ["news", "earnings", "regulatory", "research", "market_report", "company_release", "commentary", "other"]

[facets.sector]
label = "Sectors"
key = "sectors"
primary = true
icon = "grid"

